User nobody
Group nogroup

Port 3128
Timeout 600
MaxClients 200

LogLevel Info

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
StatHost "tinyproxy.stats"

Allow 127.0.0.1
Allow ::1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow fc00::/7

ConnectPort 443

DisableViaHeader Yes
